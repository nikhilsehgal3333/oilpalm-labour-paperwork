[project]
name = "oilpalm-labour-paperwork"
version = "0.1.0"
description = "An independent desk study: how India's oil palm mission (NMEO-OP) and the sustainability disclosures of the processors expanding into North-East India represent labour and its link to the environment."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nikhil Sehgal" }]
dependencies = [
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "markdown>=3.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oilpalm_paperwork"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
